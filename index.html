<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SonoVault</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1e2d4a;--navy2:#253555;--navy3:#2e3f63;--navy-light:#3a4f7a;--beige:#ede8dc;--beige2:#f5f2ec;--beige3:#faf8f5;--beige4:#fff;--text-dark:#1a2540;--text-mid:#4a5568;--text-soft:#8896a8;--text-beige:#b8a98a;--accent:#2563a8;--accent2:#3b7fd4;--success:#2d7a4f;--success-bg:#e8f5ee;--danger:#b91c1c;--danger-bg:#fef2f2;--warning:#92600a;--warning-bg:#fefce8;--border:#ddd8ce;--border2:#c8c2b6;--radius:6px;--radius-lg:10px;--font:'Georgia','Times New Roman',serif;--ui:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
html,body{height:100%;font-family:var(--ui);background:var(--beige3);color:var(--text-dark);overflow:hidden}
.login-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:32px}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:16px}
.login-title{font-family:var(--font);font-size:32px;font-weight:400;color:var(--beige);letter-spacing:1px}
.login-title b{font-weight:700}
.login-subtitle{font-size:13px;color:rgba(237,232,220,0.5);letter-spacing:0.5px}
.login-btn{display:flex;align-items:center;gap:10px;background:var(--beige);border:none;border-radius:8px;padding:13px 28px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer;font-family:var(--ui);transition:all .15s}
.login-btn:hover{background:#e8e3d8}
.login-btn svg{width:20px;height:20px}
.login-status{font-size:12px;color:rgba(237,232,220,0.4);margin-top:-16px}
.sv{display:flex;flex-direction:column;height:100vh;background:var(--beige3)}
.topbar{background:var(--navy);height:52px;display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-name{font-family:var(--font);font-size:17px;font-weight:400;color:var(--beige);letter-spacing:0.4px}
.logo-name b{font-weight:700}
.top-sep{flex:1}
.user-pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:4px 10px 4px 4px}
.user-avatar{width:22px;height:22px;border-radius:50%;background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--navy)}
.user-name{font-size:11px;color:rgba(237,232,220,0.7)}
.top-stat{font-size:11px;color:var(--text-beige);background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:3px 10px}
.top-btn{background:transparent;border:0.5px solid rgba(255,255,255,0.25);border-radius:var(--radius);padding:5px 12px;color:rgba(255,255,255,0.8);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--ui);transition:all .15s}
.top-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
.top-btn.cta{background:var(--beige);border-color:var(--beige);color:var(--navy);font-weight:500}
.top-btn.cta:hover{background:#e8e3d8}
.top-btn.logout{border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.4)}
.top-btn.logout:hover{color:rgba(255,255,255,0.8)}
.body-row{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:var(--navy2);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sb-section{padding:14px 0 6px}
.sb-label{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:rgba(237,232,220,0.35);padding:0 14px 7px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:rgba(237,232,220,0.6);transition:all .12s}
.sb-item:hover{background:rgba(255,255,255,0.06);color:var(--beige)}
.sb-item.active{background:rgba(237,232,220,0.1);color:var(--beige);border-right:2px solid var(--beige2)}
.sb-item i{font-size:14px;min-width:16px}
.sb-item .n{margin-left:auto;font-size:10px;background:rgba(255,255,255,0.08);color:rgba(237,232,220,0.4);border-radius:10px;padding:1px 6px}
.sb-item.active .n{background:rgba(237,232,220,0.15);color:rgba(237,232,220,0.7)}
.sb-div{height:0.5px;background:rgba(255,255,255,0.08);margin:4px 0}
.drive-status{padding:10px 14px;font-size:10px;color:rgba(237,232,220,0.3);display:flex;align-items:center;gap:5px;margin-top:auto;border-top:0.5px solid rgba(255,255,255,0.06)}
.drive-status i{font-size:12px}
.drive-status.ok{color:rgba(110,231,183,0.6)}
.main-col{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:var(--beige4);border-bottom:0.5px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.search-box{flex:1;position:relative}
.search-box i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-soft);pointer-events:none}
.search-box input{width:100%;background:var(--beige2);border:0.5px solid var(--border);border-radius:var(--radius);padding:7px 10px 7px 30px;font-size:12px;color:var(--text-dark);outline:none;font-family:var(--ui);transition:border-color .15s}
.search-box input:focus{border-color:var(--accent2);background:#fff}
.search-box input::placeholder{color:var(--text-soft)}
.vbtn{width:28px;height:28px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--beige2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-soft);font-size:13px;transition:all .12s}
.vbtn:hover,.vbtn.on{background:var(--navy);color:var(--beige);border-color:var(--navy)}
.gallery{flex:1;overflow-y:auto;padding:14px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.g-list{display:flex;flex-direction:column;gap:6px}
.icard{background:var(--beige4);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all .15s}
.icard:hover{border-color:var(--border2);transform:translateY(-1px)}
.icard.sel{border-color:var(--navy);border-width:1.5px}
.ithumb{width:100%;height:120px;background:var(--beige2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ithumb img{width:100%;height:100%;object-fit:cover}
.ithumb-ph{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text-beige)}
.ithumb-ph i{font-size:28px}
.ithumb-ph span{font-size:9px}
.ibadge{position:absolute;top:6px;left:6px;font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px}
.b-pat{background:var(--danger-bg);color:var(--danger)}
.b-norm{background:var(--success-bg);color:var(--success)}
.b-var{background:var(--warning-bg);color:var(--warning)}
.iinfo{padding:9px 10px}
.i-reg{font-size:9px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.i-str{font-size:12px;font-weight:500;color:var(--text-dark);line-height:1.3;margin-bottom:3px}
.i-les{font-size:10px;color:var(--text-mid);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lrow{background:var(--beige4);border:0.5px solid var(--border);border-radius:var(--radius);padding:9px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .12s}
.lrow:hover{border-color:var(--border2);background:var(--beige2)}
.lrow.sel{border-color:var(--navy)}
.lthumb{width:56px;height:40px;border-radius:4px;background:var(--beige2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0.5px solid var(--border)}
.lthumb img{width:100%;height:100%;object-fit:cover}
.lthumb i{font-size:18px;color:var(--text-soft)}
.linfo{flex:1;min-width:0}
.l-title{font-size:12px;font-weight:500;color:var(--text-dark);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-sub{font-size:10px;color:var(--text-soft)}
.lbadge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;flex-shrink:0}
.detail{width:280px;min-width:280px;background:var(--beige4);border-left:0.5px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.d-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-beige);padding:20px;text-align:center}
.d-empty i{font-size:36px}
.d-empty p{font-size:12px;line-height:1.6;color:var(--text-soft)}
.d-img{width:100%;height:170px;background:var(--beige2);overflow:hidden;position:relative;border-bottom:0.5px solid var(--border);flex-shrink:0}
.d-img img{width:100%;height:100%;object-fit:cover}
.d-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--text-beige)}
.d-img-ph i{font-size:40px}
.d-body{padding:14px;flex:1}
.d-reg{font-size:9px;font-weight:600;letter-spacing:0.7px;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.d-title{font-family:var(--font);font-size:15px;color:var(--text-dark);margin-bottom:3px;line-height:1.3}
.d-str{font-size:11px;color:var(--text-mid);margin-bottom:10px}
.d-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:10px;padding:3px 8px;border-radius:3px;font-weight:500}
.pill-navy{background:var(--navy);color:var(--beige)}
.pill-beige{background:var(--beige);color:var(--text-mid);border:0.5px solid var(--border)}
.d-desc-lbl{font-size:9px;font-weight:600;letter-spacing:0.7px;text-transform:uppercase;color:var(--text-soft);margin-bottom:5px}
.d-desc{font-size:11px;color:var(--text-mid);line-height:1.7;background:var(--beige2);border-radius:var(--radius);padding:10px 12px;border:0.5px solid var(--border)}
.d-date{font-size:10px;color:var(--text-beige);margin-top:8px}
.d-actions{padding:10px 14px;border-top:0.5px solid var(--border);display:flex;gap:7px;flex-shrink:0}
.act-btn{flex:1;padding:7px;border-radius:var(--radius);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .12s;border:0.5px solid var(--border);background:var(--beige2);color:var(--text-mid);font-family:var(--ui)}
.act-btn:hover{background:var(--navy);color:var(--beige);border-color:var(--navy)}
.act-btn.del:hover{background:var(--danger-bg);color:var(--danger);border-color:#fca5a5}
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,50,0.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--beige4);border:0.5px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal-hd{background:var(--navy);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-radius:var(--radius-lg) var(--radius-lg) 0 0;position:sticky;top:0}
.modal-hd-title{font-family:var(--font);font-size:15px;font-weight:400;color:var(--beige)}
.modal-x{background:none;border:none;color:rgba(237,232,220,0.6);cursor:pointer;font-size:18px;display:flex;align-items:center;padding:2px}
.modal-x:hover{color:var(--beige)}
.modal-bd{padding:18px;display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:10px;font-weight:600;letter-spacing:0.4px;color:var(--text-mid);text-transform:uppercase}
.fi,.fs,.ft{background:var(--beige2);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:12px;color:var(--text-dark);outline:none;font-family:var(--ui);width:100%;transition:border-color .15s}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--accent2);background:#fff}
.fs option{background:#fff}
.ft{resize:vertical;min-height:85px;line-height:1.6}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upload-z{border:1.5px dashed var(--border2);border-radius:var(--radius-lg);padding:22px;text-align:center;cursor:pointer;transition:all .15s;background:var(--beige2)}
.upload-z:hover{border-color:var(--navy-light);background:var(--beige)}
.upload-z i{font-size:28px;color:var(--text-beige);display:block;margin-bottom:7px}
.upload-z p{font-size:11px;color:var(--text-soft);line-height:1.5}
.upload-prev{width:100%;height:140px;object-fit:cover;border-radius:var(--radius);border:0.5px solid var(--border)}
.modal-ft{padding:12px 18px;border-top:0.5px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--beige2);border-radius:0 0 var(--radius-lg) var(--radius-lg);position:sticky;bottom:0}
.btn{padding:8px 18px;border-radius:var(--radius);font-size:12px;cursor:pointer;border:0.5px solid var(--border);font-family:var(--ui);transition:all .12s}
.btn-ghost{background:#fff;color:var(--text-mid)}
.btn-ghost:hover{background:var(--beige);color:var(--text-dark)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:var(--beige);font-weight:500}
.btn-primary:hover{background:var(--navy3)}
.empty-g{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--text-beige);text-align:center}
.empty-g i{font-size:48px}
.empty-g h3{font-size:14px;font-weight:500;color:var(--text-soft)}
.empty-g p{font-size:12px;line-height:1.6;max-width:280px;color:var(--text-soft)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);border:0.5px solid var(--navy-light);border-radius:var(--radius);padding:10px 16px;font-size:12px;color:var(--beige);display:flex;align-items:center;gap:8px;z-index:300;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok i{color:#6ee7b7}
.toast.err i{color:#fca5a5}
.saving-badge{display:none;align-items:center;gap:5px;font-size:10px;color:rgba(237,232,220,0.5)}
.saving-badge.show{display:flex}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body><div class="login-screen" id="login-screen">
  <div class="login-logo">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <rect width="80" height="80" rx="18" fill="#ede8dc"/>
      <rect x="5" y="5" width="70" height="70" rx="14" fill="none" stroke="#1e2d4a" stroke-width="2"/>
      <rect x="32" y="8" width="16" height="20" rx="4" fill="#1e2d4a"/>
      <rect x="29" y="27" width="22" height="4" rx="2" fill="#1e2d4a" opacity="0.5"/>
      <rect x="24" y="30" width="32" height="18" rx="5" fill="#1e2d4a"/>
      <path d="M24 44 Q40 60 56 44" fill="#1e2d4a"/>
      <path d="M19 60 Q40 78 61 60" fill="none" stroke="#1e2d4a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
      <path d="M14 70 Q40 92 66 70" fill="none" stroke="#1e2d4a" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3"/>
    </svg>
    <div class="login-title">Sono<b>Vault</b></div>
    <div class="login-subtitle">Banco de imagens ultrassonográficas</div>
  </div>
  <button class="login-btn" onclick="signIn()">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Entrar com Google
  </button>
  <div class="login-status" id="login-status">Clínica Senhor dos Passos</div>
</div>

<div class="sv" id="app" style="display:none">
  <div class="topbar">
    <div class="logo-wrap">
      <svg width="34" height="34" viewBox="0 0 80 80"><rect width="80" height="80" rx="18" fill="#ede8dc"/><rect x="5" y="5" width="70" height="70" rx="14" fill="none" stroke="#1e2d4a" stroke-width="2"/><rect x="32" y="8" width="16" height="20" rx="4" fill="#1e2d4a"/><rect x="29" y="27" width="22" height="4" rx="2" fill="#1e2d4a" opacity="0.5"/><rect x="24" y="30" width="32" height="18" rx="5" fill="#1e2d4a"/><path d="M24 44 Q40 60 56 44" fill="#1e2d4a"/><path d="M19 60 Q40 78 61 60" fill="none" stroke="#1e2d4a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/><path d="M14 70 Q40 92 66 70" fill="none" stroke="#1e2d4a" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3"/></svg>
      <div class="logo-name">Sono<b>Vault</b></div>
    </div>
    <div class="saving-badge" id="saving-badge"><i class="ti ti-cloud-upload" style="font-size:12px"></i> Salvando...</div>
    <div class="top-sep"></div>
    <span class="top-stat" id="top-stat">0 imagens</span>
    <div class="user-pill"><div class="user-avatar" id="user-initials">R</div><span class="user-name" id="user-name-top">...</span></div>
    <button class="top-btn" onclick="exportData()"><i class="ti ti-download" style="font-size:12px"></i> Exportar</button>
    <button class="top-btn cta" onclick="openModal()"><i class="ti ti-plus" style="font-size:12px"></i> Nova imagem</button>
    <button class="top-btn logout" onclick="signOut()" title="Sair"><i class="ti ti-logout" style="font-size:13px"></i></button>
  </div>
  <div class="body-row">
    <div class="sidebar">
      <div class="sb-section">
        <div class="sb-label">Visualizar</div>
        <div class="sb-item active" onclick="filterBy('all',this)"><i class="ti ti-layout-grid"></i>Todas<span class="n" id="cn-all">0</span></div>
        <div class="sb-item" onclick="filterBy('patologia',this)"><i class="ti ti-alert-circle"></i>Patologia<span class="n" id="cn-pat">0</span></div>
        <div class="sb-item" onclick="filterBy('normal',this)"><i class="ti ti-circle-check"></i>Normal<span class="n" id="cn-norm">0</span></div>
        <div class="sb-item" onclick="filterBy('variante',this)"><i class="ti ti-git-branch"></i>Variante<span class="n" id="cn-var">0</span></div>
      </div>
      <div class="sb-div"></div>
      <div class="sb-section"><div class="sb-label">Regiões</div><div id="sb-regions"></div></div>
      <div class="drive-status ok" id="drive-status"><i class="ti ti-cloud-check"></i> Google Drive conectado</div>
    </div>
    <div class="main-col">
      <div class="toolbar">
        <div class="search-box"><i class="ti ti-search"></i><input type="text" id="q" placeholder="Buscar estrutura, achado, descrição..." oninput="renderGallery()"></div>
        <div class="vbtn on" id="vg" onclick="setView('grid')"><i class="ti ti-layout-grid"></i></div>
        <div class="vbtn" id="vl" onclick="setView('list')"><i class="ti ti-list"></i></div>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
    <div class="detail" id="detail"><div class="d-empty"><i class="ti ti-hand-click"></i><p>Selecione uma imagem para ver detalhes</p></div></div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-hd"><span class="modal-hd-title" id="modal-ttl">Nova imagem</span><button class="modal-x" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    <div class="modal-bd">
      <div class="upload-z" id="upload-z" onclick="document.getElementById('fi').click()"><i class="ti ti-photo-up"></i><p>Clique para selecionar imagem<br><span style="font-size:10px;color:var(--text-beige)">JPG, PNG — máx. 8MB</span></p></div>
      <input type="file" id="fi" accept="image/*" style="display:none" onchange="handleFile(this)">
      <div class="frow">
        <div class="fg"><label class="fl">Região</label><select class="fs" id="i-reg" onchange="fillStructures()"><option value="">Selecionar...</option><option>Ombro</option><option>Joelho</option><option>Tornozelo</option><option>Cotovelo</option><option>Mão</option><option>Punho</option><option>Quadril</option><option>Abdômen</option><option>Tireoide</option><option>Mama</option><option>Pélvico</option><option>Vascular</option><option>Outra</option></select></div>
        <div class="fg"><label class="fl">Estrutura</label><input class="fi" id="i-str" placeholder="Ex: Tendão supraespinhal" list="str-dl"><datalist id="str-dl"></datalist></div>
      </div>
      <div class="fg"><label class="fl">Achado / tipo de lesão</label><input class="fi" id="i-les" placeholder="Ex: Rotura parcial, Tendinopatia..."></div>
      <div class="frow">
        <div class="fg"><label class="fl">Categoria</label><select class="fs" id="i-cat"><option value="patologia">Patologia</option><option value="normal">Normal</option><option value="variante">Variante anatômica</option></select></div>
        <div class="fg"><label class="fl">Grau / nível (opcional)</label><input class="fi" id="i-lvl" placeholder="Ex: Grau II"></div>
      </div>
      <div class="fg"><label class="fl">Descrição do achado</label><textarea class="ft" id="i-desc" placeholder="Descrição no estilo do laudo..."></textarea></div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="save-btn" onclick="saveImg()"><i class="ti ti-check" style="font-size:12px"></i> Salvar imagem</button></div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg">Salvo</span></div>

<script>
const CLIENT_ID='155144252138-es5iuh573njhfvu1mtiih5qg5eok5r1b.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
const DB_FILENAME='sonovault-db.json';
const FOLDER_NAME='SonoVault';
let imgs=[],filter='all',region=null,view='grid',selId=null,editId=null,dataURL=null;
let tokenClient,accessToken=null,driveDbFileId=null,driveFolderId=null,saveTimeout=null;
const STRUCTS={Ombro:['Tendão supraespinhal','Tendão infraespinhal','Tendão subescapular','Cabo longo do bíceps','Articulação AC','Bursa subacromial'],Joelho:['Tendão patelar','Tendão quadricipital','Ligamento colateral medial','Ligamento colateral lateral','Menisco medial','Menisco lateral','Cisto poplíteo','Pata de ganso'],Tornozelo:['Tendão calcâneo','Tendão tibial posterior','Tendões fibulares','Ligamento LTFA','Fáscia plantar','Sindesmose tibioperoneal','Seio do tarso'],Cotovelo:['Origem dos extensores','Origem dos flexores','Tendão do bíceps distal','Tendão do tríceps','Nervo ulnar','Bursa olecraniana'],Mão:['Polia A1','Polia A2','Ligamento colateral ulnar','Placa volar','Tendões flexores','Tendões extensores'],Punho:['Nervo mediano','Nervo ulnar','Tendões extensores','Tendões flexores','Canal de Guyon'],Quadril:['Tendão glúteo médio','Tendão glúteo mínimo','Tendão iliopsoas','Bursa trocantérica'],Abdômen:['Fígado','Vesícula biliar','Pâncreas','Baço','Rim direito','Rim esquerdo'],Tireoide:['Lobo direito','Lobo esquerdo','Istmo','Linfonodos cervicais'],Mama:['Quadrante superolateral','Quadrante superomedial','Quadrante inferolateral','Região retroareolar'],Vascular:['Veia safena magna','Veia safena parva','Sistema venoso profundo','Artéria carótida']};
function initGoogleAuth(){tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async(resp)=>{if(resp.error){toast('Erro no login: '+resp.error,'err');return}accessToken=resp.access_token;await loadUserInfo();await initDrive();showApp()}})}
function signIn(){document.getElementById('login-status').textContent='Conectando...';tokenClient.requestAccessToken({prompt:'consent'})}
function signOut(){if(accessToken)google.accounts.oauth2.revoke(accessToken);accessToken=null;imgs=[];driveDbFileId=null;driveFolderId=null;document.getElementById('app').style.display='none';document.getElementById('login-screen').style.display='flex';document.getElementById('login-status').textContent='Clínica Senhor dos Passos'}
async function loadUserInfo(){try{const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+accessToken}});const u=await r.json();const name=u.given_name||u.name||'Usuário';document.getElementById('user-name-top').textContent=name;document.getElementById('user-initials').textContent=name.charAt(0).toUpperCase()}catch(e){}}
function showApp(){document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex'}
async function driveReq(url,opts={}){const resp=await fetch(url,{...opts,headers:{Authorization:'Bearer '+accessToken,...(opts.headers||{})}});if(!resp.ok)throw new Error('Drive error '+resp.status);return resp}
async function getOrCreateFolder(){const q=encodeURIComponent(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);const r=await driveReq(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);const data=await r.json();if(data.files&&data.files.length>0)return data.files[0].id;const cr=await driveReq('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FOLDER_NAME,mimeType:'application/vnd.google-apps.folder'})});const folder=await cr.json();return folder.id}
async function getDbFileId(folderId){const q=encodeURIComponent(`name='${DB_FILENAME}' and '${folderId}' in parents and trashed=false`);const r=await driveReq(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);const data=await r.json();return data.files&&data.files.length>0?data.files[0].id:null}
async function initDrive(){try{driveFolderId=await getOrCreateFolder();driveDbFileId=await getDbFileId(driveFolderId);if(driveDbFileId){const r=await driveReq(`https://www.googleapis.com/drive/v3/files/${driveDbFileId}?alt=media`);const data=await r.json();imgs=Array.isArray(data)?data:[]}else{imgs=[]}document.getElementById('drive-status').className='drive-status ok';document.getElementById('drive-status').innerHTML='<i class="ti ti-cloud-check"></i> Google Drive conectado';renderAll()}catch(e){document.getElementById('drive-status').className='drive-status';document.getElementById('drive-status').innerHTML='<i class="ti ti-cloud-off"></i> Erro no Drive';toast('Erro ao conectar Drive','err')}}
async function saveToDrive(){if(!accessToken||!driveFolderId)return;document.getElementById('saving-badge').classList.add('show');try{const blob=new Blob([JSON.stringify(imgs)],{type:'application/json'});if(driveDbFileId){await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveDbFileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:blob})}else{const meta={name:DB_FILENAME,parents:[driveFolderId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',blob);const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+accessToken},body:form});const f=await r.json();driveDbFileId=f.id}}catch(e){toast('Erro ao salvar no Drive','err')}finally{document.getElementById('saving-badge').classList.remove('show')}}
function scheduleSave(){clearTimeout(saveTimeout);saveTimeout=setTimeout(saveToDrive,1500)}
function fillStructures(){const r=document.getElementById('i-reg').value,dl=document.getElementById('str-dl');dl.innerHTML='';(STRUCTS[r]||[]).forEach(s=>{const o=document.createElement('option');o.value=s;dl.appendChild(o)})}
function handleFile(inp){const f=inp.files[0];if(!f)return;if(f.size>8*1024*1024){toast('Imagem muito grande','err');return}const rd=new FileReader();rd.onload=e=>{dataURL=e.target.result;document.getElementById('upload-z').innerHTML=`<img src="${dataURL}" class="upload-prev">`};rd.readAsDataURL(f)}
function openModal(id=null){editId=id;dataURL=null;document.getElementById('modal-overlay').style.display='flex';if(id){const img=imgs.find(i=>i.id===id);if(!img)return;document.getElementById('modal-ttl').textContent='Editar imagem';document.getElementById('i-reg').value=img.region||'';fillStructures();document.getElementById('i-str').value=img.structure||'';document.getElementById('i-les').value=img.lesion||'';document.getElementById('i-cat').value=img.category||'patologia';document.getElementById('i-lvl').value=img.level||'';document.getElementById('i-desc').value=img.description||'';if(img.dataURL){document.getElementById('upload-z').innerHTML=`<img src="${img.dataURL}" class="upload-prev">`;dataURL=img.dataURL}else{document.getElementById('upload-z').innerHTML='<i class="ti ti-photo-up"></i><p>Clique para selecionar imagem</p>'}}else{document.getElementById('modal-ttl').textContent='Nova imagem';['i-str','i-les','i-lvl','i-desc'].forEach(x=>{const e=document.getElementById(x);if(e)e.value=''});document.getElementById('i-reg').value='';document.getElementById('i-cat').value='patologia';document.getElementById('upload-z').innerHTML='<i class="ti ti-photo-up"></i><p>Clique para selecionar imagem<br><span style="font-size:10px;color:var(--text-beige)">JPG, PNG — máx. 8MB</span></p>'}}
function closeModal(){document.getElementById('modal-overlay').style.display='none';document.getElementById('fi').value='';editId=null;dataURL=null}
async function saveImg(){const reg=document.getElementById('i-reg').value.trim(),str=document.getElementById('i-str').value.trim(),les=document.getElementById('i-les').value.trim();if(!reg||!str||!les){toast('Preencha região, estrutura e achado','err');return}const btn=document.getElementById('save-btn');btn.disabled=true;btn.textContent='Salvando...';const obj={id:editId||Date.now().toString(),region:reg,structure:str,lesion:les,category:document.getElementById('i-cat').value,level:document.getElementById('i-lvl').value.trim(),description:document.getElementById('i-desc').value.trim(),dataURL,date:editId?(imgs.find(i=>i.id===editId)?.date||new Date().toISOString()):new Date().toISOString()};if(editId){const x=imgs.findIndex(i=>i.id===editId);if(x>-1)imgs[x]=obj}else imgs.unshift(obj);scheduleSave();closeModal();btn.disabled=false;btn.innerHTML='<i class="ti ti-check" style="font-size:12px"></i> Salvar imagem';renderAll();toast(editId?'Imagem atualizada':'Imagem salva','ok');selId=obj.id;renderGallery();renderDetail(imgs.find(i=>i.id===obj.id))}
async function delImg(id){imgs=imgs.filter(i=>i.id!==id);scheduleSave();selId=null;renderAll();renderDetail(null);toast('Imagem removida','ok')}
function filterBy(v,el){filter=v;region=null;document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));el.classList.add('active');renderGallery()}
function filterReg(r,el){region=r;filter=null;document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));el.classList.add('active');renderGallery()}
function setView(v){view=v;document.getElementById('vg').classList.toggle('on',v==='grid');document.getElementById('vl').classList.toggle('on',v==='list');renderGallery()}
function getFiltered(){const q=document.getElementById('q').value.toLowerCase();return imgs.filter(img=>{if(filter&&filter!=='all'&&img.category!==filter)return false;if(region&&img.region!==region)return false;if(q){const h=[img.region,img.structure,img.lesion,img.description,img.level].join(' ').toLowerCase();if(!h.includes(q))return false}return true})}
function bCls(c){return c==='normal'?'b-norm':c==='variante'?'b-var':'b-pat'}
function bLbl(c){return c==='normal'?'Normal':c==='variante'?'Variante':'Patologia'}
function renderGallery(){const f=getFiltered(),g=document.getElementById('gallery');if(!f.length){g.innerHTML='<div class="empty-g"><i class="ti ti-photo-off"></i><h3>Nenhuma imagem encontrada</h3><p>Adicione imagens ou ajuste os filtros.</p></div>';return}if(view==='grid'){g.innerHTML=`<div class="g-grid">${f.map(img=>{const s=img.id===selId?'sel':'',th=img.dataURL?`<img src="${img.dataURL}" alt="">`:'<div class="ithumb-ph"><i class="ti ti-photo"></i><span>Sem imagem</span></div>';return`<div class="icard ${s}" onclick="selectImg('${img.id}')"><div class="ithumb">${th}<span class="ibadge ${bCls(img.category)}">${bLbl(img.category)}</span></div><div class="iinfo"><div class="i-reg">${img.region}</div><div class="i-str">${img.structure}</div><div class="i-les">${img.lesion}${img.level?' — '+img.level:''}</div></div></div>`}).join('')}</div>`}else{g.innerHTML=`<div class="g-list">${f.map(img=>{const s=img.id===selId?'sel':'',th=img.dataURL?`<img src="${img.dataURL}" alt="">`:'<i class="ti ti-photo"></i>';return`<div class="lrow ${s}" onclick="selectImg('${img.id}')"><div class="lthumb">${th}</div><div class="linfo"><div class="l-title">${img.structure} — ${img.lesion}</div><div class="l-sub">${img.region}${img.level?' · '+img.level:''}</div></div><span class="lbadge ${bCls(img.category)}">${bLbl(img.category)}</span></div>`}).join('')}</div>`}}
function renderSidebar(){const regs=[...new Set(imgs.map(i=>i.region))].filter(Boolean).sort();document.getElementById('sb-regions').innerHTML=regs.map(r=>{const c=imgs.filter(i=>i.region===r).length,icons={Ombro:'user',Joelho:'run',Tornozelo:'run',Cotovelo:'user',Mão:'hand-stop',Punho:'wrist-watch',Quadril:'user',Abdômen:'ripple',Tireoide:'ripple',Mama:'ripple',Vascular:'waves',Pélvico:'ripple'};return`<div class="sb-item" onclick="filterReg('${r}',this)"><i class="ti ti-${icons[r]||'circle'}"></i>${r}<span class="n">${c}</span></div>`}).join('');const ct={all:imgs.length,patologia:0,normal:0,variante:0};imgs.forEach(i=>{if(ct[i.category]!==undefined)ct[i.category]++});document.getElementById('cn-all').textContent=ct.all;document.getElementById('cn-pat').textContent=ct.patologia;document.getElementById('cn-norm').textContent=ct.normal;document.getElementById('cn-var').textContent=ct.variante;document.getElementById('top-stat').textContent=`${imgs.length} imagem${imgs.length!==1?'ns':''}`}
function selectImg(id){selId=id;renderGallery();renderDetail(imgs.find(i=>i.id===id))}
function renderDetail(img){const p=document.getElementById('detail');if(!img){p.innerHTML='<div class="d-empty"><i class="ti ti-hand-click"></i><p>Selecione uma imagem para ver detalhes</p></div>';return}const dt=img.date?new Date(img.date).toLocaleDateString('pt-BR'):'',th=img.dataURL?`<img src="${img.dataURL}" alt="">`:'<div class="d-img-ph"><i class="ti ti-photo"></i></div>';p.innerHTML=`<div class="d-img">${th}</div><div class="d-body"><div class="d-reg">${img.region}</div><div class="d-title">${img.structure}</div><div class="d-str">${img.lesion}${img.level?' — '+img.level:''}</div><div class="d-pills"><span class="pill ${bCls(img.category)==='b-pat'?'pill-navy':'pill-beige'}">${bLbl(img.category)}</span>${img.level?`<span class="pill pill-beige">${img.level}</span>`:''}</div>${img.description?`<div class="d-desc-lbl">Descrição do achado</div><div class="d-desc">${img.description}</div>`:''}<div class="d-date">${dt}</div></div><div class="d-actions"><button class="act-btn" onclick="openModal('${img.id}')"><i class="ti ti-edit" style="font-size:13px"></i> Editar</button><button class="act-btn del" onclick="delImg('${img.id}')"><i class="ti ti-trash" style="font-size:13px"></i> Excluir</button></div>`}
function renderAll(){renderSidebar();renderGallery()}
function toast(msg,type='ok'){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;t.className=`toast show ${type}`;t.querySelector('i').className=type==='ok'?'ti ti-check':type==='info'?'ti ti-info-circle':'ti ti-alert-circle';setTimeout(()=>{t.className='toast'},2800)}
function exportData(){if(!imgs.length){toast('Nenhuma imagem para exportar','err');return}const b=new Blob([JSON.stringify(imgs,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`sonovault-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);toast('Backup exportado','ok')}
window.onload=()=>{initGoogleAuth()}
</script>
</body>
</html>
